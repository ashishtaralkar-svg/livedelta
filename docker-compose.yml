services:
  revbreakbot:
    build: .
    image: deltabot:latest
    container_name: revbreakbot
    restart: always
    env_file:
      - .env.revbreak
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # NOT YET ACTIVE -- uncomment once .env.heikinashi is filled in with the
  # Delta SUB-ACCOUNT's own API key/secret (copy .env.heikinashi.example ->
  # .env.heikinashi first). Runs on separate capital from revbreakbot above,
  # so the two can never collide on position ownership.
  heikinashibot:
    build: .
    image: deltabot:latest
    container_name: heikinashibot
    restart: always
    env_file:
      - .env.heikinashi
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # Dchannel bot -- runs on its OWN Delta SUB-ACCOUNT, in parallel with
  # revbreakbot which it NEVER touches (separate capital, separate
  # DELTA_STATE_FILE=state/dchannel_pos.json). Fill .env.dchannel first
  # (cp .env.dchannel.example .env.dchannel, add the sub-account API keys).
  # Bring it up ALONE so the running revbreakbot is not recreated:
  #   docker compose up -d --build dchannelbot
  dchannelbot:
    build: .
    image: deltabot:latest
    container_name: dchannelbot
    restart: always
    env_file:
      - .env.dchannel
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # DCv2 bot -- runs on its OWN Delta SUB-ACCOUNT, in parallel with the other
  # bots which it NEVER touches (separate capital, DELTA_STATE_FILE=state/dcv2_pos.json).
  # Fill .env.dcv2 first (cp .env.dcv2.example .env.dcv2, add the sub-account API
  # keys). Bring it up ALONE so the other running bots are not recreated:
  #   docker compose up -d --build dcv2bot
  dcv2bot:
    build: .
    image: deltabot:latest
    container_name: dcv2bot
    restart: always
    env_file:
      - .env.dcv2
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # DCv3 bot -- DCv2's signal logic but BUYS options instead of selling
  # (the mirror of dcv2bot), on its OWN Delta SUB-ACCOUNT, in parallel with
  # dcv2bot/the other bots which it NEVER touches (separate capital,
  # DELTA_STATE_FILE=state/dcv3_pos.json). Fill .env.dcv3 first (cp
  # .env.dcv3.example .env.dcv3, add the sub-account API keys). Bring it up
  # ALONE so the other running bots are not recreated:
  #   docker compose up -d --build dcv3bot
  dcv3bot:
    build: .
    image: deltabot:latest
    container_name: dcv3bot
    restart: always
    env_file:
      - .env.dcv3
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # ==========================================================================
  # DISABLED 2026-09-07: taken out of the active fleet so ONLY sarbot runs on
  # this instance going forward. Confirmed all three FLAT (no owned position,
  # dcv2simbot never held real capital anyway -- DELTA_PAPER_MODE=true) via
  # `docker compose logs`/state-file checks before stopping, then commented
  # out here (not deleted) so `docker compose up -d` / a host reboot can't
  # silently resurrect them despite restart:always. Uncomment + git pull to
  # bring any of these back.
  # ==========================================================================
  # # DCv2-SIM shadow bot -- runs the SAME DCv2 strategy CLOSED-BAR (the backtest
  # # model) but places NO real orders (DELTA_PAPER_MODE=true). It posts
  # # [DCv2-SIM] signals to Telegram so you can compare the model against the live
  # # dcv2bot in real time. Uses NO capital and can reuse any read-capable key.
  # # Fill .env.dcv2sim first. Bring it up ALONE:
  # #   docker compose up -d --build dcv2simbot
  # dcv2simbot:
  #   build: .
  #   image: deltabot:latest
  #   container_name: dcv2simbot
  #   restart: always
  #   env_file:
  #     - .env.dcv2sim
  #   volumes:
  #     - ./state:/app/state
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "20m"
  #       max-file: "5"
  #   stop_grace_period: 30s
  #
  # # EMA21 Breakdown bot -- 15m EMA(21) anchor/breakout pattern, BUYS options
  # # (bullish -> buy CALL, bearish -> buy PUT), on its OWN Delta SUB-ACCOUNT, in
  # # parallel with the other bots which it NEVER touches (separate capital,
  # # DELTA_STATE_FILE=state/ema21_pos.json). Fill .env.ema21 first (cp
  # # .env.ema21.example .env.ema21, add the sub-account API keys). This is the
  # # newest, least-proven strategy in the fleet (backtest only, never executed a
  # # real order) -- .env.ema21.example starts DELTA_OPTION_CONTRACTS at 1.
  # # Bring it up ALONE so the other running bots are not recreated:
  # #   docker compose up -d --build ema21bot
  # ema21bot:
  #   build: .
  #   image: deltabot:latest
  #   container_name: ema21bot
  #   restart: always
  #   env_file:
  #     - .env.ema21
  #   volumes:
  #     - ./state:/app/state
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "20m"
  #       max-file: "5"
  #   stop_grace_period: 30s
  #
  # # Supertrend Fixed-SL bot -- 5m Supertrend(10,3) flip timing, frozen SL, NO
  # # profit target, SELLS options. Unlike every other bot, holds a CE and PE
  # # leg SIMULTANEOUSLY as independent contracts. Own Delta SUB-ACCOUNT, in
  # # parallel with the other bots which it NEVER touches (separate capital,
  # # DELTA_STATE_FILE=state/supertrend_pos.json -- the engine derives two
  # # per-leg files from this). Fill .env.supertrend first (cp
  # # .env.supertrend.example .env.supertrend, add the sub-account API keys).
  # # This engine has NEVER executed a real order -- watch it closely. Bring it
  # # up ALONE so the other running bots are not recreated:
  # #   docker compose up -d --build supertrendbot
  # supertrendbot:
  #   build: .
  #   image: deltabot:latest
  #   container_name: supertrendbot
  #   restart: always
  #   env_file:
  #     - .env.supertrend
  #   volumes:
  #     - ./state:/app/state
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "20m"
  #       max-file: "5"
  #   stop_grace_period: 30s

  # Range Engulfing Fade bot -- 15m red/green range-engulfing pattern,
  # SELL-only, ATM, fixed 1:1 SL/TARGET. The FIRST engine in the fleet with
  # genuine INTRACANDLE execution (reacts to real-time price within a
  # forming candle, not just at candle close) -- see the module docstring in
  # core/range_engulfing_fade_sell_trader.py. Own Delta SUB-ACCOUNT, in
  # parallel with the other bots which it NEVER touches (separate capital,
  # DELTA_STATE_FILE=state/range_fade_pos.json). Fill .env.range_fade first
  # (cp .env.range_fade.example .env.range_fade, add the sub-account API
  # keys) -- DELTA_OPTION_OFFSET=0 is REQUIRED for ATM. This engine has
  # NEVER executed a real order, on a never-before-used real-time code path
  # -- starts at DELTA_OPTION_CONTRACTS=1, watch it closely. Backtested net
  # NEGATIVE on both 7d and 30d windows tested so far (see the .env example
  # for numbers) -- do not raise the lot size or treat this as validated.
  # Bring it up ALONE so the other running bots are not recreated:
  #   docker compose up -d --build rangefadebot
  rangefadebot:
    build: .
    image: deltabot:latest
    container_name: rangefadebot
    restart: always
    env_file:
      - .env.range_fade
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # Supertrend Stop-And-Reverse (SAR) bot -- 1m Supertrend(10,3), STRICT
  # SINGLE POSITION (unlike supertrendbot above, never CE+PE at once),
  # SELLS options. Candle-color first entry at 17:35 IST (deliberately right
  # next to the 17:30 evening-restart trigger, collapsing both into one
  # entry window), frozen-SL reversals (day-low/day-high, widened by a
  # min-ATR guard), a 70%-decay TP that immediately RE-SELLS the same
  # direction (roll), and the evening restart itself -- see
  # src/deltabot/strategy/supertrend_sar.py's module docstring for the full
  # v1-v5 rule history. Own Delta SUB-ACCOUNT, in parallel with the other
  # bots which it NEVER touches (separate capital,
  # DELTA_STATE_FILE=state/sar_pos.json). Fill .env.sar first (cp
  # .env.sar.example .env.sar, add the sub-account API keys). This engine
  # has NEVER executed a real order -- watch it closely. This config
  # (candle-color entry, restart 17:30, reset 05:30, TP 70%, weekend
  # blackout on) is the FINAL one, chosen after comparing several
  # candidates (including ORB entry and a 17:30 reset) head-to-head on
  # matched 1wk/1mo/3mo backtests: 3mo +$363.25/441 legs (58.3% win) at 10
  # lots vs the original 5m/05:35/TP-50% baseline's +$150.22/324 legs
  # (48.8% win) -- see .env.sar.example for the full comparison table.
  # Bring it up ALONE so the other running bots are not recreated:
  #   docker compose up -d --build sarbot
  sarbot:
    build: .
    image: deltabot:latest
    container_name: sarbot
    restart: always
    env_file:
      - .env.sar
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s

  # Supertrend 15m-Filter Fixed-SL bot -- 1m Supertrend(10,3) entry, gated by
  # a 15m Supertrend(10,3) confirmation filter (LOCKED at each 15m boundary,
  # not live-repainting), SL FROZEN at the flip candle's own Supertrend value
  # (no trailing, no auto-reverse -- unlike sarbot above), SELLS options.
  # STRICT SINGLE POSITION (like sarbot, never CE+PE at once). Profit target
  # checked once per closed 1m candle (REDUCTION convention -- see
  # .env.st15f.example), then blocked from re-entering until the 15m
  # Supertrend itself has its own next fresh flip. NO daily square-off, NO
  # rollover. Own Delta SUB-ACCOUNT, in parallel with the other bots which it
  # NEVER touches (separate capital, DELTA_STATE_FILE=state/st15f_pos.json).
  # Fill .env.st15f first (cp .env.st15f.example .env.st15f, add the
  # sub-account API keys). Best backtest (1m, 25 lots, target 70%, premium
  # ~1400): 3mo +$635.26/483 legs/28.8% win -- the most consistent pace and
  # win rate across 1wk/1mo/3mo of any strategy tested this session. This
  # engine has NEVER executed a real order -- watch it closely. Bring it up
  # ALONE so the other running bots are not recreated:
  #   docker compose up -d --build st15fbot
  st15fbot:
    build: .
    image: deltabot:latest
    container_name: st15fbot
    restart: always
    env_file:
      - .env.st15f
    volumes:
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 30s
